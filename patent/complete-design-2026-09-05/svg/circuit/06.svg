<svg xmlns="http://www.w3.org/2000/svg" width="1190.5511811023623pt" height="841.8897637795277pt" viewBox="0 0 1190.5511811023623 841.8897637795277">
<title>Eight-neuron integrate-and-fire datapath</title>
<rect width="100%" height="100%" fill="white"/>
<rect x="40" y="45" width="1110.5511811023623" height="751.8897637795277" fill="none" stroke="black"/>
<text x="55" y="68.0" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700">ENER  /  EIGHT-NEURON INTEGRATE-AND-FIRE DATAPATH</text>
<path d="M40,758.8897637795277 L1150.5511811023623,758.8897637795277" stroke="black" stroke-width="1" fill="none"/>
<text x="55" y="776.8897637795277" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">FHE + NEUROMORPHIC RELAY  |  REFERENCE DESIGN B  |  2026-09-05</text>
<text x="1135.5511811023623" y="776.8897637795277" text-anchor="end" font-family="Arial,sans-serif" font-size="10" font-weight="400">C06  /  8</text>
<text x="55" y="792.8897637795277" text-anchor="start" font-family="Arial,sans-serif" font-size="9" font-weight="400">Schematic design and simulated logic; PCB and assembled hardware not validated.</text>
<rect x="60" y="142" width="285" height="82" fill="none" stroke="black"/>
<text x="202.5" y="172.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">ACCEPTED INPUT EVENT</text>
<text x="202.5" y="186.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">source channel c, time t</text>
<text x="202.5" y="201.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">from threshold + 100 us gate</text>
<rect x="428" y="135" width="335" height="98" fill="none" stroke="black"/>
<text x="595.5" y="166.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">SYNAPSE ADDRESS / ROM</text>
<text x="595.5" y="180.92000000000002" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">W[n,c] = 16 when n=c</text>
<text x="595.5" y="195.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">W[n,c] = 4 when n=(c+1) mod 8</text>
<text x="595.5" y="209.08" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">otherwise 0; n scans 0..7</text>
<path d="M345,183 L428,183" stroke="black" stroke-width="1" fill="none"/>
<path d="M428,183 L421.0,186.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M428,183 L421.0,180.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="847" y="142" width="280" height="82" fill="none" stroke="black"/>
<text x="987.0" y="172.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">NEURON STATE</text>
<text x="987.0" y="186.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">8 x 16-bit unsigned V</text>
<text x="987.0" y="201.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">8 x 2-bit refractory counters</text>
<rect x="445" y="311" width="300" height="68" fill="none" stroke="black"/>
<text x="595.0" y="341.92" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">17-BIT ADDER</text>
<text x="595.0" y="356.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">u = V[n] + W[n,c]</text>
<path d="M596,233 L596,311" stroke="black" stroke-width="1" fill="none"/>
<path d="M596,311 L593.0,304.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M596,311 L599.0,304.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M988,224 L988,345" stroke="black" stroke-width="1" fill="none"/>
<path d="M988,345 L745,345" stroke="black" stroke-width="1" fill="none"/>
<path d="M745,345 L752.0,342.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M745,345 L752.0,348.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="445" y="438" width="300" height="80" fill="none" stroke="black"/>
<text x="595.0" y="467.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">THRESHOLD COMPARATOR</text>
<text x="595.0" y="481.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">u &gt;= theta</text>
<text x="595.0" y="496.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">theta default = 64</text>
<path d="M595,379 L595,438" stroke="black" stroke-width="1" fill="none"/>
<path d="M595,438 L592.0,431.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M595,438 L598.0,431.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="839" y="438" width="290" height="80" fill="none" stroke="black"/>
<text x="984.0" y="467.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">SPIKE / RESET MUX</text>
<text x="984.0" y="481.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">fire: V[n]=0, refractory=2</text>
<text x="984.0" y="496.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">no fire: V[n]=u</text>
<path d="M745,478 L839,478" stroke="black" stroke-width="1" fill="none"/>
<path d="M839,478 L832.0,481.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M839,478 L832.0,475.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M987,438 L987,392" stroke="black" stroke-width="1" fill="none"/>
<path d="M987,392 L1138,392" stroke="black" stroke-width="1" fill="none"/>
<path d="M1138,392 L1138,195" stroke="black" stroke-width="1" fill="none"/>
<path d="M1138,195 L1127,195" stroke="black" stroke-width="1" fill="none"/>
<path d="M1127,195 L1134.0,192.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M1127,195 L1134.0,198.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="60" y="311" width="325" height="94" fill="none" stroke="black"/>
<text x="222.5" y="347.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">1 ms LEAK TICK</text>
<text x="222.5" y="361.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">V[n] &lt;- V[n] - (V[n] &gt;&gt; 4)</text>
<text x="222.5" y="376.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">refractory &lt;- max(0, refractory-1)</text>
<path d="M385,350 L410,350" stroke="black" stroke-width="1" fill="none"/>
<path d="M410,350 L410,256" stroke="black" stroke-width="1" fill="none"/>
<path d="M410,256 L988,256" stroke="black" stroke-width="1" fill="none"/>
<path d="M988,256 L988,224" stroke="black" stroke-width="1" fill="none"/>
<path d="M988,224 L991.0,231.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M988,224 L985.0,231.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="445" y="605" width="300" height="82" fill="none" stroke="black"/>
<text x="595.0" y="635.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">COUNT READOUT</text>
<text x="595.0" y="649.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">64 x 2-bit saturating counters</text>
<text x="595.0" y="664.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">index = 8*floor(t/6250) + n</text>
<path d="M595,518 L595,605" stroke="black" stroke-width="1" fill="none"/>
<path d="M595,605 L592.0,598.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M595,605 L598.0,598.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="60" y="465" width="325" height="86" fill="none" stroke="black"/>
<text x="222.5" y="497.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">REFRACTORY GATE</text>
<text x="222.5" y="511.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">Skip integration when refractory &gt; 0</text>
<text x="222.5" y="526.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">Ticks occur before same-time events</text>
<path d="M385,508 L410,508" stroke="black" stroke-width="1" fill="none"/>
<path d="M410,508 L410,478" stroke="black" stroke-width="1" fill="none"/>
<path d="M410,478 L445,478" stroke="black" stroke-width="1" fill="none"/>
<path d="M445,478 L438.0,481.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M445,478 L438.0,475.0" stroke="black" stroke-width="1" fill="none"/>
<text x="60" y="713.0" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">Every accepted source event visits eight output neurons. The two nonzero synapses form a local ring with self-input.</text>
<text x="60" y="725.8" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">The host sends timestamps relative to the frame; ADVANCE applies all missing millisecond ticks before integration.</text>
<text x="60" y="738.6" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">All neuron state resets on BEGIN. This explicit frame-local spiking profile requires its own classifier and calibration.</text>
</svg>