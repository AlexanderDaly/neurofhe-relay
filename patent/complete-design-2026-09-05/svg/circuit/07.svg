<text x="635.0" y="522.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">56-bit body, 8-bit CRC</text>
<text x="635.0" y="537.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">57 cycles to finalize response</text>
