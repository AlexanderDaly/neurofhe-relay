<text x="410" y="625.0" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">Single functional clock: 16 MHz. Runtime SPI: mode 0, &lt;= 1 MHz; CS setup/hold &gt;= 1 us.</text>
<text x="410" y="637.8" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">Three flip-flops synchronize each asynchronous input. Software polls READY before each transaction.</text>
<text x="410" y="650.6" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">A reply describes the previous command; opcode and sequence echo prevent accidental association with the next job.</text>
<text x="410" y="663.4" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">CRC detects transmission errors; authenticated network transport and local trust provide separate security controls.</text>
</svg>