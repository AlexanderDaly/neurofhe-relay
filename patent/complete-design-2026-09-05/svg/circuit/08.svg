<text x="227.5" y="355.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">BFVrns ENCRYPTION</text>
<text x="227.5" y="369.91999999999996" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">t = 65537; batch size = 1</text>
<text x="227.5" y="384.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">128-classic security setting</text>
<text x="227.5" y="398.08" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">context selects and records N,Q</text>
