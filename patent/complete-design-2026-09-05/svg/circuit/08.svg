<text x="635.0" y="526.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">COMPONENTWISE CT ADD</text>
<text x="635.0" y="540.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">Y_k &lt;- Y_k + EvalMult(c_i,w[k,i])</text>
<text x="635.0" y="555.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">initialize Y_k = Encrypt(pk,b_k)</text>
