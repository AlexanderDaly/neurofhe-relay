<text x="635.0" y="363.38" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">CT x PT PRODUCT</text>
<text x="635.0" y="377.46" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">(c0_i * p[k,i], c1_i * p[k,i])</text>
<text x="635.0" y="391.54" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">ring arithmetic modulo each q_j</text>
