<text x="227.5" y="533.92" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">center-lift integers; range check</text>
<text x="227.5" y="547.9999999999999" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">argmax only after decrypt</text>
