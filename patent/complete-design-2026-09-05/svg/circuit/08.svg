<text x="60" y="681.0" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">The CPU executes this software arithmetic; U1 performs local neuromorphic encoding before encryption.</text>
<text x="60" y="693.8" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">Exact sparse support is exposed only under an approved support-visible profile. The default exports all 64 encrypted positions.</text>
<text x="60" y="706.6" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">Model bound: max_k (abs(b_k) + 3*sum_i abs(w[k,i])) &lt;= 32768. No modular-wrap ambiguity within this signed range.</text>
<text x="60" y="719.4" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">The network protocol is a specified integration contract; the repository native demo executes client and evaluator in one process.</text>
