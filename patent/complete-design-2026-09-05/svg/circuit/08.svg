<text x="990.0" y="540.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">result ID and context bindings</text>
<text x="990.0" y="555.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">plaintext output count = C</text>
