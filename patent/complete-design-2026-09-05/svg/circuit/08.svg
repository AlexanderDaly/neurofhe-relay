<text x="635.0" y="188.92000000000002" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">Ciphertexts c_i = (c0_i,c1_i)</text>
<text x="635.0" y="203.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">Public scalar weights w[k,i]</text>
<text x="635.0" y="217.08" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">Encrypted accumulator Y_k</text>
