<text x="227.5" y="174.84" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">TRUSTED HOST RAM</text>
<text x="227.5" y="188.92000000000002" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">x[64] in {0,1,2,3}</text>
<text x="227.5" y="203.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">model ID / frame ID / context ID</text>
<text x="227.5" y="217.08" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">secret key remains local</text>
