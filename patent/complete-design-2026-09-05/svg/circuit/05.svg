<svg xmlns="http://www.w3.org/2000/svg" width="1190.5511811023623pt" height="841.8897637795277pt" viewBox="0 0 1190.5511811023623 841.8897637795277">
<title>Spatial event detection and counter circuit</title>
<rect width="100%" height="100%" fill="white"/>
<rect x="40" y="45" width="1110.5511811023623" height="751.8897637795277" fill="none" stroke="black"/>
<text x="55" y="68.0" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700">ENER  /  SPATIAL EVENT DETECTION AND COUNTER CIRCUIT</text>
<path d="M40,758.8897637795277 L1150.5511811023623,758.8897637795277" stroke="black" stroke-width="1" fill="none"/>
<text x="55" y="776.8897637795277" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">FHE + NEUROMORPHIC RELAY  |  REFERENCE DESIGN B  |  2026-09-05</text>
<text x="1135.5511811023623" y="776.8897637795277" text-anchor="end" font-family="Arial,sans-serif" font-size="10" font-weight="400">C05  /  8</text>
<text x="55" y="792.8897637795277" text-anchor="start" font-family="Arial,sans-serif" font-size="9" font-weight="400">Schematic design and simulated logic; PCB and assembled hardware not validated.</text>
<rect x="70" y="140" width="260" height="84" fill="none" stroke="black"/>
<text x="200.0" y="171.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">SAMPLE REGISTER</text>
<text x="200.0" y="185.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">channel[2:0] | time[15:0]</text>
<text x="200.0" y="200.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">amplitude[15:0] signed</text>
<rect x="70" y="280" width="260" height="80" fill="none" stroke="black"/>
<text x="200.0" y="309.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">17-BIT ABSOLUTE VALUE</text>
<text x="200.0" y="323.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">sign extend / two&#x27;s complement</text>
<text x="200.0" y="338.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">includes -32768</text>
<path d="M200,224 L200,280" stroke="black" stroke-width="1" fill="none"/>
<path d="M200,280 L197.0,273.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M200,280 L203.0,273.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="70" y="410" width="260" height="78" fill="none" stroke="black"/>
<text x="200.0" y="438.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">UNSIGNED COMPARATOR</text>
<text x="200.0" y="452.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">abs(amplitude) &gt;= threshold</text>
<text x="200.0" y="467.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">default threshold = 50</text>
<path d="M200,360 L200,410" stroke="black" stroke-width="1" fill="none"/>
<path d="M200,410 L197.0,403.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M200,410 L203.0,403.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="450" y="140" width="295" height="84" fill="none" stroke="black"/>
<text x="597.5" y="171.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">TIME BIN COMPARATORS</text>
<text x="597.5" y="185.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">6250, 12500, ... , 43750 us</text>
<text x="597.5" y="200.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">index[5:0] = {bin[2:0], channel}</text>
<path d="M330,180 L450,180" stroke="black" stroke-width="1" fill="none"/>
<path d="M450,180 L443.0,183.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M450,180 L443.0,177.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="840" y="140" width="285" height="84" fill="none" stroke="black"/>
<text x="982.5" y="171.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">LAST ACCEPTED REGISTER FILE</text>
<text x="982.5" y="185.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">8 x 16-bit timestamps + 8 valid bits</text>
<text x="982.5" y="200.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">read by channel[2:0]</text>
<rect x="840" y="280" width="285" height="80" fill="none" stroke="black"/>
<text x="982.5" y="309.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">SUBTRACT / COMPARE</text>
<text x="982.5" y="323.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">time - last[channel] &gt;= 100 us</text>
<text x="982.5" y="338.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">or no previous accepted event</text>
<path d="M985,224 L985,280" stroke="black" stroke-width="1" fill="none"/>
<path d="M985,280 L982.0,273.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M985,280 L988.0,273.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="450" y="410" width="295" height="78" fill="none" stroke="black"/>
<text x="597.5" y="438.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">ACCEPT ENABLE</text>
<text x="597.5" y="452.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">valid frame AND threshold</text>
<text x="597.5" y="467.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">AND refractory AND count &lt; 3</text>
<path d="M330,449 L450,449" stroke="black" stroke-width="1" fill="none"/>
<path d="M450,449 L443.0,452.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M450,449 L443.0,446.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M985,360 L985,450" stroke="black" stroke-width="1" fill="none"/>
<path d="M985,450 L745,450" stroke="black" stroke-width="1" fill="none"/>
<path d="M745,450 L752.0,447.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M745,450 L752.0,453.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="450" y="565" width="295" height="84" fill="none" stroke="black"/>
<text x="597.5" y="596.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">COUNT REGISTER FILE</text>
<text x="597.5" y="610.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">64 x 2 bits; synchronous write</text>
<text x="597.5" y="625.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">address = index[5:0]</text>
<path d="M595,224 L595,410" stroke="black" stroke-width="1" fill="none"/>
<path d="M595,410 L592.0,403.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M595,410 L598.0,403.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M595,488 L595,565" stroke="black" stroke-width="1" fill="none"/>
<path d="M595,565 L592.0,558.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M595,565 L598.0,558.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="70" y="565" width="300" height="84" fill="none" stroke="black"/>
<text x="220.0" y="596.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">2-BIT SATURATING INCREMENT</text>
<text x="220.0" y="610.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">0 -&gt; 1 -&gt; 2 -&gt; 3</text>
<text x="220.0" y="625.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">write last timestamp only on increment</text>
<path d="M450,605 L370,605" stroke="black" stroke-width="1" fill="none"/>
<path d="M370,605 L377.0,602.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M370,605 L377.0,608.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M220,565 L220,526" stroke="black" stroke-width="1" fill="none"/>
<path d="M220,526 L450,526" stroke="black" stroke-width="1" fill="none"/>
<path d="M450,526 L450,585" stroke="black" stroke-width="1" fill="none"/>
<path d="M450,585 L447.0,578.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M450,585 L453.0,578.0" stroke="black" stroke-width="1" fill="none"/>
<rect x="840" y="565" width="285" height="84" fill="none" stroke="black"/>
<text x="982.5" y="596.88" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">FROZEN READ PORT</text>
<text x="982.5" y="610.96" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">READ_COUNT index = 0..63</text>
<text x="982.5" y="625.04" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400">zero-extended 16-bit reply</text>
<path d="M745,605 L840,605" stroke="black" stroke-width="1" fill="none"/>
<path d="M840,605 L833.0,608.0" stroke="black" stroke-width="1" fill="none"/>
<path d="M840,605 L833.0,602.0" stroke="black" stroke-width="1" fill="none"/>
<text x="60" y="694.0" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">BEGIN clears all 64 counters and frame-local history; END freezes the store only if the entire frame is valid.</text>
<text x="60" y="706.8" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">Input must be in nondecreasing timestamp order. Equal timestamps retain source order. The host performs sorting.</text>
<text x="60" y="719.6" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="400">This is threshold-based spatial event detection. Channel identifiers do not imply isolated biological neurons.</text>
</svg>